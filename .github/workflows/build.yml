name: Build ThermalDynamics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ThermalDynamics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ================= 装配 CoFHCore =================
      - name: Install local CoFHCore to maven
        run: |
          M2_DIR=$HOME/.m2/repository/com/teamcofh/cofh_core/1.21.1-11.0.2
          mkdir -p $M2_DIR
          find local_libs -name "cofh_core-*.jar" -exec cp {} $M2_DIR/cofh_core-1.21.1-11.0.2.jar \;
          echo '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>com.teamcofh</groupId><artifactId>cofh_core</artifactId><version>1.21.1-11.0.2</version></project>' > $M2_DIR/cofh_core-1.21.1-11.0.2.pom

      # ================= 装配 ThermalCore =================
      - name: Install local ThermalCore to maven
        run: |
          M2_DIR=$HOME/.m2/repository/com/teamcofh/thermal_core/1.21.1-11.0.7.0
          mkdir -p $M2_DIR
          find local_libs -name "thermal_core-*.jar" -exec cp {} $M2_DIR/thermal_core-1.21.1-11.0.7.0.jar \;
          echo '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>com.teamcofh</groupId><artifactId>thermal_core</artifactId><version>1.21.1-11.0.7.0</version></project>' > $M2_DIR/thermal_core-1.21.1-11.0.7.0.pom
          ls -la $M2_DIR
      
      # ================= 构建 ThermalDynamics =================
      - name: Build ThermalDynamics
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: dynamics-jars
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error
